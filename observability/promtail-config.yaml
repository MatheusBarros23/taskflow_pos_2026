server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: taskflow
    static_configs:
      - targets: [localhost]
        labels:
          job: taskflow
          app: taskflow
          __path__: /var/log/taskflow/*.log
    pipeline_stages:
      - json:
          expressions:
            ts: ts
            level: level
            event: event
      # Labels so com poucos valores; ip e usuario ficam no corpo (| json).
      - labels:
          level:
          event:
      - timestamp:
          source: ts
          format: RFC3339Nano
