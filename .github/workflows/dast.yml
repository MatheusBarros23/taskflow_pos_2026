name: DAST

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET: http://127.0.0.1:8000
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238

jobs:
  zap:
    name: ZAP (DAST)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Segredos vem dos GitHub Secrets do repositorio (Settings > Secrets and
      # variables > Actions). O .env fica so no runner e nunca e commitado.
      - name: Subir a stack (app + Postgres) com docker compose
        env:
          TASKFLOW_SECRET_KEY: ${{ secrets.TASKFLOW_SECRET_KEY }}
          TASKFLOW_ADMIN_PASSWORD: ${{ secrets.TASKFLOW_ADMIN_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          for name in TASKFLOW_SECRET_KEY TASKFLOW_ADMIN_PASSWORD POSTGRES_PASSWORD GRAFANA_ADMIN_PASSWORD; do
            [ -n "${!name}" ] || { echo "Secret $name nao cadastrado no repositorio." >&2; exit 1; }
          done
          echo "TASKFLOW_ADMIN_PASSWORD=$TASKFLOW_ADMIN_PASSWORD" >> "$GITHUB_ENV"
          umask 077
          cat > .env <<ENV
          TASKFLOW_SECRET_KEY=$TASKFLOW_SECRET_KEY
          TASKFLOW_ADMIN_PASSWORD=$TASKFLOW_ADMIN_PASSWORD
          POSTGRES_USER=taskflow
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=taskflow
          WEB_PORT=8000
          GRAFANA_ADMIN_PASSWORD=$GRAFANA_ADMIN_PASSWORD
          ENV
          docker compose up -d --build

      # Sem isso o ZAP atacaria o nada e o relatorio sairia "limpo".
      - name: Esperar a aplicacao responder em /login
        run: |
          for i in $(seq 1 30); do
            if curl -sSf -o /dev/null "$TARGET/login"; then
              echo "Aplicacao respondendo (tentativa $i)."
              exit 0
            fi
            echo "Aguardando a aplicacao... ($i/30)"
            sleep 2
          done
          echo "A aplicacao nao respondeu a tempo." >&2
          docker compose logs || true
          exit 1

      - name: Verificar CSRF e /debug/info
        run: |
          jar="$(mktemp)"
          token() { sed -n 's/.*name="csrf_token" value="\([^"]*\)".*/\1/p'; }
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          [ "$(code "$TARGET/debug/info")" = "404" ] || { echo "/debug/info deve dar 404"; exit 1; }
          [ "$(code -d username=admin -d password=x "$TARGET/login")" = "400" ] || { echo "POST sem token CSRF deve dar 400"; exit 1; }

          t="$(curl -s -c "$jar" -b "$jar" "$TARGET/login" | token)"
          [ "$(code -c "$jar" -b "$jar" --data-urlencode "csrf_token=$t" -d username=admin \
            --data-urlencode "password=$TASKFLOW_ADMIN_PASSWORD" "$TARGET/login")" = "302" ] \
            || { echo "login valido deve dar 302"; exit 1; }
          echo "CSRF e /debug/info OK."
          # Sessao autenticada para o ZAP alcancar /tasks e /tasks/new.
          curl -s -o /dev/null -c "$jar" -b "$jar" "$TARGET/tasks/new"
          cookie="$(awk '$6=="session"{print $7}' "$jar")"
          echo "::add-mask::$cookie"
          echo "ZAP_SESSION=$cookie" >> "$GITHUB_ENV"

      - name: Preparar pasta dos relatorios
        run: mkdir -p zap-out && chmod 777 zap-out && cp .zap/rules.tsv zap-out/rules.tsv

      # Gate: SEM continue-on-error e SEM -I. Qualquer WARN (exit 2) ou FAIL (exit 1) quebra o job.
      - name: ZAP Baseline (passivo, todas as paginas)
        run: |
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$TARGET/" -c rules.tsv -m 1 \
            -r baseline.html -J baseline.json \
            -z "-config replacer.full_list(0).description=auth \
                -config replacer.full_list(0).enabled=true \
                -config replacer.full_list(0).matchtype=REQ_HEADER \
                -config replacer.full_list(0).matchstr=Cookie \
                -config replacer.full_list(0).regex=false \
                -config replacer.full_list(0).replacement=session=${ZAP_SESSION}"

      # O baseline e so passivo e nao encontra XSS; o scan ativo cobre isso.
      - name: ZAP Full Scan (ativo, injecao e XSS)
        run: |
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-full-scan.py -t "$TARGET/" -c rules.tsv -m 1 \
            -r full.html -J full.json \
            -z "-config replacer.full_list(0).description=auth \
                -config replacer.full_list(0).enabled=true \
                -config replacer.full_list(0).matchtype=REQ_HEADER \
                -config replacer.full_list(0).matchstr=Cookie \
                -config replacer.full_list(0).regex=false \
                -config replacer.full_list(0).replacement=session=${ZAP_SESSION}"

      - name: Publicar relatorios do ZAP
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-reports
          path: |
            zap-out/*.html
            zap-out/*.json
          if-no-files-found: warn

      - name: Encerrar a aplicacao
        if: always()
        run: docker compose down -v || true
