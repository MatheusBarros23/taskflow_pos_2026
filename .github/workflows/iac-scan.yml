name: IaC Scan

# Sem filtro "paths": estes jobs sao required checks e precisam rodar em
# todo PR, senao PRs que nao mexem em infraestrutura ficam travados.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.13.3"
  CHECKOV_VERSION: "3.3.30"
  TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
  IAC_FRAMEWORKS: terraform dockerfile github_actions
  SKIP_PATH: codigo

jobs:
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: terraform validate
        run: terraform validate

  compose:
    name: Compose validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: docker compose config
        run: docker compose --env-file .env.example config --quiet

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar Checkov
        run: pip install "checkov==${CHECKOV_VERSION}"

      - name: Checkov (gate)
        # IAC_FRAMEWORKS sem aspas de proposito: vira um argumento por framework.
        run: |
          checkov --directory . \
            --framework ${IAC_FRAMEWORKS} \
            --skip-path "${SKIP_PATH}" \
            --skip-download \
            --compact

  trivy-config:
    name: Trivy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy config (gate HIGH,CRITICAL)
        run: |
          docker run --rm -v "$PWD:/src:ro" "$TRIVY_IMAGE" config \
            --severity HIGH,CRITICAL \
            --skip-dirs "/src/${SKIP_PATH}" \
            --exit-code 1 \
            /src
